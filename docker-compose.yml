# ---------------------------------------------------------------------------
# Entorno local completo: Kafka en modo KRaft (+UI), Postgres, Airflow.
# Justificación "Docker Compose vs instalación nativa": docs/architecture-decisions.md -> ADR-002.
# Justificación "KRaft vs Zookeeper": docs/architecture-decisions.md -> ADR-003b.
# Un solo comando levanta todo, igual en Windows/Mac/Linux: `docker compose up -d`
# ---------------------------------------------------------------------------

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy

services:
  # --- Mensajería: desacopla las fuentes (API, CSV simulado) del procesamiento (Spark). ADR-003 ---
  # Imagen oficial de Apache Kafka, modo KRaft combinado (broker+controller en un solo nodo,
  # apropiado para desarrollo individual). Sin Zookeeper: ver ADR-003 para el porqué.
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"   # acceso desde tu máquina (productores Python corriendo fuera de Docker)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dos listeners: uno para tráfico interno de la red de Docker (kafka-ui, futuros
      # jobs de Spark/Airflow en contenedor) y otro para clientes en el host (tus productores).
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # UI web para inspeccionar tópicos/mensajes sin usar la CLI. Gratis, muy usado en la industria.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  # --- Emula S3 en tu máquina: Terraform (infra/terraform/) aprovisiona acá,
  # sin cuenta de AWS ni costo. Ver infra/terraform/README.md.
  # Pineado a 4.4.0 (última release "community", sin cuenta) a propósito:
  # desde 2026.3.0 LocalStack unificó la imagen community+pro y exige
  # LOCALSTACK_AUTH_TOKEN (cuenta gratuita en app.localstack.cloud) incluso
  # para arrancar. Va contra el objetivo del proyecto de cero fricción/cuentas
  # externas — si en algún momento querés las features nuevas, la alternativa
  # es crear la cuenta gratis y setear LOCALSTACK_AUTH_TOKEN acá. ---
  localstack:
    image: localstack/localstack:4.4.0
    container_name: localstack
    ports:
      - "4566:4566"   # edge port: todos los servicios de AWS emulados salen por acá
    environment:
      SERVICES: s3
      DEBUG: 0
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Base de datos de metadatos de Airflow (no es parte del Lakehouse) ---
  postgres:
    image: postgres:16
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      # Antes decía "-U airflow" hardcodeado — si cambiás AIRFLOW_DB_USER en .env
      # queda desalineado. También le doy más margen (start_period) porque en el
      # primer arranque, con el volumen recién creado, Postgres hace initdb y
      # se reinicia una vez internamente antes de quedar listo — si el healthcheck
      # justo cae en ese reinicio y se queda sin retries, se reporta como fallido.
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- Orquestación: ADR-007. Corre una vez, prepara la DB y crea el usuario admin ---
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Fernando \
          --lastname Blanco \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
  localstack-data:
